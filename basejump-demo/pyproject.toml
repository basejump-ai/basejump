[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "basejump-demo"
version = "0.1.0"
description = "Demo usage of basejump (local development only - not for distribution as a package)"
authors = [{ name = "Andreas Martinson", email = "andreas.martinson@basejump.ai" }]
requires-python = ">=3.11,<3.13"
readme = "README.md"
license = {file = "LICENSE.md"}
dependencies = ["basejump-core>=0.31.0"]

[tool.hatch.build.targets.wheel]
packages = ["basejump"]