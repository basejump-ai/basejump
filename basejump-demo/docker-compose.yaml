services:
  db:
    container_name: postgres
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: localuser
      POSTGRES_PASSWORD: localuser123
      POSTGRES_DB: localdb
    ports:
      - "5432:5432"
  app:
    container_name: python_app
    build: .
    depends_on:
      - db
      - cache
    env_file:
      - .env
    stdin_open: true
    tty: true
  cache:
    container_name: redis
    image: redis/redis-stack-server:latest
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - cache:/data
volumes:
  cache:
    driver: local
